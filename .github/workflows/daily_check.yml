name: daily_check

on:
  # 発火は外部スケジューラ(GAS時間トリガー)から workflow_dispatch で行う
  # GitHub Actions の schedule は遅延が大きいため使用しない
  workflow_dispatch:

# 画像はGAS経由で共有ドライブに保存するだけなので、リポジトリへの書き込みは不要
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate images & upload to Drive (via GAS)
        env:
          SPREADSHEET_ID_KANTO:  ${{ secrets.SPREADSHEET_ID_KANTO }}
          SPREADSHEET_ID_KANSAI: ${{ secrets.SPREADSHEET_ID_KANSAI }}
          SPREADSHEET_ID_KYUSHU: ${{ secrets.SPREADSHEET_ID_KYUSHU }}
          GOOGLE_API_KEY:        ${{ secrets.GOOGLE_API_KEY }}
          GAS_WEBAPP_URL:        ${{ secrets.GAS_WEBAPP_URL }}
          GAS_TOKEN:             ${{ secrets.GAS_TOKEN }}
        run: python main.py
